version: "3.9"

services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/gym_ai_tracker
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me}
      ML_SERVICE_URL: http://ml-service:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 4000
      NODE_ENV: production
    depends_on:
      - mongo
      - ml-service
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
